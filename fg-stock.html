<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMT FG STOCK</title><style> *{box-sizing:border-box}body{margin:0;background:#f1f5f9;font:16px system-ui;color:#142638}header{background:#142638;color:white;padding:22px}main{max-width:1100px;margin:auto;padding:16px}section{background:white;padding:18px;border-radius:12px;margin-bottom:14px}input,select,button{font:inherit;padding:10px;border:1px solid #cbd5e1;border-radius:7px;margin:4px;max-width:100%}button{background:#176b55;color:white;cursor:pointer}button:disabled{opacity:.5}table{border-collapse:collapse;width:100%}td,th{padding:10px;text-align:left;border-bottom:1px solid #ddd} .scroll{overflow:auto} .tiles{display:flex;flex-wrap:wrap;gap:12px}.tiles section{flex:1;min-width:140px}h2{margin:0 0 12px}a{color:inherit}#msg{white-space:pre-wrap;color:#a33}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><header><b>S METAL TECH | QC & QA SM</b><h1>03. FG STOCK</h1><a href="index.html">Internal Claim</a></header><main><section id="login"><form id="loginForm"><h2>เข้าสู่ระบบ</h2><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button>Login</button></form></section><p id="msg" role="alert"></p><div id="app" hidden><section><span id="who"></span><button id="logout">Logout</button><button id="refresh">Refresh</button></section><div class="tiles"><section> TOTAL PCS<h2 id="total"></h2></section><section>CONFIRMED<h2 id="confirmed"></h2></section><section>PENDING<h2 id="pending"></h2></section></div><section><h2>Current Stock</h2><input id="search" placeholder="Item / Drawing / Description"><div class="scroll"><table><thead><tr><th>Item</th><th>Description</th><th>Drawing</th><th>PCS</th><th>Status</th></tr></thead><tbody id="stock"></tbody></table></div></section><section id="movement"><h2>Stock IN / OUT</h2><form id="moveForm"><select id="item" required></select><select id="kind"><option>IN</option><option>OUT</option></select><input id="qty" type="number" min="1" step="1" required placeholder="PCS"><input id="reference" required placeholder="Reference / Delivery No."><button id="post">บันทึก</button></form></section><section><h2>Stock History</h2><button id="export">Export CSV</button><div class="scroll"><table><thead><tr><th>Date</th><th>Item</th><th>Type</th><th>PCS</th><th>Reference</th><th>User ID</th></tr></thead><tbody id="history"></tbody></table></div></section><section>Stock Count / Item Management: ยังไม่เปิดใช้งานในรุ่นทดสอบนี้</section></div></main><script>
const $=id=>document.getElementById(id), db=supabase.createClient('https://zbzntyllcfekoaocpukp.supabase.co','sb_publishable_gdTQ_E2F6DQVuBdAublQZQ_asYRmyG1');let rows=[],tx=[],role=null,request=null,busy=false;const err=e=>{$('msg').textContent=e.message||String(e)};function check(r){if(r.error)throw r.error;return r.data}function table(id,data){$(id).replaceChildren(...data.map(a=>{let tr=document.createElement('tr');for(let v of a){let td=document.createElement('td');td.textContent=v??'';tr.append(td)}return tr}))}async function all(name,order){let out=[];for(let i=0;;i+=500){let a=check(await db.from(name).select('*').order(order).range(i,i+499));out.push(...a);if(a.length<500)return out}}function render(){let q=$('search').value.toLowerCase();table('stock',rows.filter(r=>[r.item_code,r.description,r.drawing_no].join(' ').toLowerCase().includes(q)).map(r=>[r.item_code||'PENDING',r.description,r.drawing_no,r.stock_qty,r.code_status]));}async function load(){rows=await all('fg_current_stock','id');tx=await all('fg_transactions','id');for(let [id,filter] of [['total',()=>true],['confirmed',r=>!!r.item_code],['pending',r=>!r.item_code]])$(id).textContent=rows.filter(filter).reduce((s,r)=>s+Number(r.stock_qty),0);let old=$('item').value;$('item').replaceChildren(...rows.map(r=>new Option((r.item_code||'PENDING')+' | '+r.description+' | '+r.stock_qty,r.id)));if(rows.some(r=>r.id===old))$('item').value=old;render();tx.sort((a,b)=>b.created_at.localeCompare(a.created_at));table('history',tx.map(historyRow));}function historyRow(t){return [new Date(t.created_at).toLocaleString('th-TH'),rows.find(r=>r.id===t.item_id)?.item_code||'PENDING',t.kind,t.qty,t.reference,t.created_by]}async function start(){ $('app').hidden=true;let u=check(await db.auth.getUser()).user;if(!u)return;let m=check(await db.from('fg_members').select('role').eq('user_id',u.id).maybeSingle());if(!m)throw Error('ไม่มีสิทธิ์ FG STOCK');role=m.role;$('who').textContent=u.email+' | '+role;$('movement').hidden=role==='viewer';await load();$('login').hidden=true;$('app').hidden=false; }$('loginForm').onsubmit=async e=>{e.preventDefault();try{$('msg').textContent='';let f=new FormData(e.target);check(await db.auth.signInWithPassword({email:f.get('email'),password:f.get('password')}));e.target.reset();await start()}catch(e){err(e)}};$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};$('refresh').onclick=()=>load().catch(err);$('search').oninput=render;$('moveForm').onsubmit=async e=>{e.preventDefault();if(busy)return;let n=Number($('qty').value),k=$('kind').value,r=$('reference').value.trim(),item=$('item').value;if(!Number.isSafeInteger(n)||n<1||!r)return err(Error('ตรวจสอบจำนวนและ Reference'));if(!confirm(k+' '+n+' PCS?'))return;let p={p_item:item,p_kind:k,p_qty:k==='OUT'?-n:n,p_reference:r};let signature=JSON.stringify(p);if(!request||request.signature!==signature)request={signature,id:crypto.randomUUID()};busy=true;$('post').disabled=true;try{check(await db.rpc('fg_post_transaction',{...p,p_request:request.id}));request=null;$('qty').value='';$('reference').value='';$('msg').textContent='บันทึกสำเร็จ';await load()}catch(e){err(e)}finally{busy=false;$('post').disabled=false}};$('export').onclick=()=>{let csv=[['Date','Item','Type','PCS','Reference','User ID'],...tx.map(historyRow)].map(a=>a.map(v=>'"'+String(v??'').replace(/^[=+@\-]/,"'$&").replaceAll('"','""')+'"').join(',')).join('\r\n');let url=URL.createObjectURL(new Blob(['\ufeff',csv],{type:'text/csv'}));let a=document.createElement('a');a.href=url;a.download='FG-history.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};db.auth.getSession().then(r=>{if(r.data.session)start().catch(err)});
</script></html>
