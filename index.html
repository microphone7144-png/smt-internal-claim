function bounds(){let d=date($('day').value),a=new Date(d),b=new Date(d);if($('period').value==='week'){a.setDate(a.getDate()-(a.getDay()+2)%7);b=new Date(a);b.setDate(b.getDate()+6)}else if($('period').value==='month'){a.setDate(1);b=new Date(a.getFullYear(),a.getMonth()+1,0)}else{a=new Date(d.getFullYear(),0,1);b=new Date(d.getFullYear(),11,31)}return [fmt(a),fmt(b)]}function shift(n){let [a]=bounds(),d=date(a),p=$('period').value;if(p==='week')d.setDate(d.getDate()+7*n);else if(p==='month')d.setMonth(d.getMonth()+n);else d.setFullYear(d.getFullYear()+n);$('day').value=fmt(d);render()}function selected(){let [a,b]=bounds();return records.filter(r=>r.date>=a&&r.date<=b)}function show(p){if(role!=='editor'&&['entry','history'].includes(p))return;page=p;filter=p==='photos'?{k:'dept',v:peopleDept}:null;editing=null;render()}function issues(){return [...new Set([...baseIssues,...records.map(r=>r.issue)])]}function count(rs,key){let m={};rs.forEach(r=>m[r[key]]=(m[r[key]]||0)+1);return Object.entries(m).sort((a,b)=>b[1]-a[1])}function drill(k,v){page='photos';filter={k,v};if(k==='owner')peopleDept=roster.find(x=>x[0]===v)?.[1]||peopleDept;render();window.scrollTo(0,0)}function bars(title,rs,k){let a=count(rs,k),max=a[0]?.[1]||1;return `<section class="panel"><h3 style="color:#78b6ff">${title}</h3>${a.map(([n,v],i)=>`<div style="cursor:pointer" data-k="${k}" data-v="${esc(n)}" onclick="drill(this.dataset.k,this.dataset.v)">${esc(n)} <b style="float:right">${v} ครั้ง</b><div class="bar"><i style="width:${v/max*100}%;background:${['#60a5fa','#2dd4bf','#fbbf24','#a78bfa','#fb7185'][i%5]}"></i></div></div>`).join('')||'ยังไม่มีข้อมูล'}</section>`}function render(){let rs=selected(),[a,b]=bounds();$('range').textContent=a+' ถึง '+b;updateWeeks();$('printhead').innerHTML='<h2>S METAL TECH — INTERNAL CLAIM</h2>'+esc(a+' ถึง '+b)+' | PILOT';let h='';if(page==='dash'){h=`<div class="grid"><div class="panel">จำนวนเครม<h1>${rs.length} ครั้ง</h1></div><div class="panel">ผู้รับผิดชอบ button onclick="exportCSV()">Export CSV (Excel)</button></div><section class="panel"><h2>ตารางภาพรวมพนักงาน / แผนก</h2><div class="scroll"><table><thead><tr><th>พนักงาน / แผนก</th>${is.map(x=>`<th class="vert"><span>${esc(x)}</span></th>`).join('')}<th>Total</th></tr></thead><tbody>${rows.map(([n,d,nick],i)=>`${i===0||rows[i-1][1]!==d?`<tr class="group"><td colspan="${is.length+2}">${esc(d)}</td></tr>`:''}<tr><td data-owner="${esc(n)}" onclick="drill('owner',this.dataset.owner)" style="cursor:pointer">${esc(nick===n?n:n+' ('+nick+')')}</td>${is.map(x=>{let v=rs.filter(r=>r.owner===n&&r.issue===x).length;return `<td class="${v>1?'repeat':v?'hit':''}" data-owner="${esc(n)}" data-issue="${esc(x)}" onclick="cell(this)">${v||''}</td>`}).join('')}<td class="total">${rs.filter(r=>r.owner===n).length}</td></tr>`).join('')}<tr><td>Total</td>${is.map(x=>`<td class="total">${rs.filter(r=>r.issue===x).length}</td>`).join('')}<td class="total">${rs.length}</td></tr></tbody></table></div></section>`}else{let list=rs.filter(r=>!filter||(filter.k==='cell'?r.owner===filter.v&&r.issue===filter.issue:r[filter.k]===filter.v));if(page==='history')list=rs;list.sort((a,b)=>a.dept.localeCompare(b.dept)||a.owner.localeCompare(b.owner)||a.date.localeCompare(b.date));h=`<div class="toolbar"><select onchange="filter=this.value?{k:'owner',v:this.value}:null;render()"><option value="">ทุกคน / ทุกแผนก</option>${roster.filter(x=>individual(x[1])||x[0]===x[1]).map(x=>`<option value="${esc(x[0])}" ${filter?.v===x[0]?'selected':''}>${esc(x[2])}</option>`).join('')}</select><button onclick="filter=null;render()">ล้างตัวกรอง</button><button onclick="printAllPhotos()">พิมพ์รายงานตามที่เลือก</button></div><h2>${page==='history'?'ประวัติ / แก้ไข ตามช่วงที่เลือก':'รูปปัญหาและสิ่งที่ต้องปรับปรุง'} (${list.length} เครม)</h2>${filter?`<p>${esc(filter.v)} ${esc(filter.issue)}</p>`:''}<div class="cards">${list.map(r=>`<article class="claim"><b>${esc(r.dept===r.owner?r.dept:r.dept+" / "+r.owner)}</b><p>${esc(r.d .target);try{let pics=[];for(let file of e.target.pics.files)pics.push(await pic(file));let r={id:editing?.id||'IC-'+crypto.randomUUID(),date:f.get('date'),job:f.get('job'),dept:f.get('dept'),owner:f.get('owner'),issue:f.get('issue'),qty:Number(f.get('qty')),improve:f.get('improve'),pics:[...(editing?.pics||[]),...pics],demo:editing?.demo||false};records=records.filter(x=>x.id!==r.id).concat(r);await persist();$('day').value=r.date;show('matrix')}catch(e){records=before;alert('บันทึกไม่สำเร็จ: '+e)}finally{saving=false;btn.disabled=false}}function edit(id){if(role!=='editor')return;editing=records.find(r=>r.id===id);page='entry';render()}async function removeClaim(id){if(role!=='editor')return;if(confirm('ลบรายการนี้?')){records=records.filter(r=>r.id!==id);await persist();render()}}async function seed(){if(role!=='editor')return;if(records.some(r=>r.demo)){alert('มีข้อมูลทดลองแล้ว');return}let a=roster.filter(x=>individual(x[1]));for(let i=0;i<8;i++)records.push({id:'DEMO-'+(i+1),date:$('day').value,job:'งานทดลอง '+(i+1),dept:'Welding',owner:a[i%3][0],issue:baseIssues[4+i%3],qty:i+1,improve:'ตัวอย่างเท่านั้น: ตรวจสอบตาม Check Sheet',pics:[],demo:true});await persist();render()}function zoom(src){let d=document.createElement('dialog');d.innerHTML=`<button onclick="this.parentNode.remove()">ปิด</button><br><img style="max-width:85vw;max-height:80vh" src="${esc(src)}">`;document.body.append(d);d.showModal()}function exportCSV(){let is=issues(),rs=selected(),a=[['พนักงาน / แผนก',...is,'Total'],...roster.filter(x=>individual(x[1])||x[0]===x[1]).map(([n])=>[n,...is.map(x=>rs.filter(r=>r.owner===n&&r.issue===x).length),rs.filter(r=>r.owner===n).length])];let b=new Blob(['\ufeff'+a.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='SMT_Internal_Claim.csv';l.click();URL.revokeObjectURL(l.href)}async function printAllPhotos(){let imgs=[...document.querySelectorAll('.claim img')];imgs.forEach(i=>i.loading='eager');await Promise.all(imgs.map(i=>i.decode().catch(()=>{})));window.print()}
